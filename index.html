<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: two-column grid of phones; a tap opens the phone centred in a dialog with its options */
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#15171c; --muted:#8a8f9c; --line:#e3e5ec;
  --tile:#1b1b1b; --ok:#1f9d55; --scrim:rgba(243,244,247,.72);
  --sim-red:#e0343b; --sim-blue:#2b6fe0;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;padding-block:32px 48px;padding-inline:16px}
body.lock{overflow:hidden}
.grid{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:block;width:100%;padding:12px;background:var(--card);border:0;border-radius:22px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(21,23,28,.09)}
.card:focus-visible{outline:3px solid var(--sim-blue);outline-offset:3px}
.photo{display:block;width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--tile);object-fit:cover}

/* Dialog */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s ease}
.modal{position:relative;width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--card);border-radius:26px;padding:16px;box-shadow:0 30px 80px rgba(21,23,28,.18);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal .photo{border-radius:18px}
.close{position:absolute;top:24px;right:24px;width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.16);border:0;color:#fff;cursor:pointer}
.close:hover{background:rgba(255,255,255,.28)}
.close svg{width:18px;height:18px}
.opts{display:grid;gap:14px;padding-top:16px}
.row{display:flex;gap:10px}
.row>button{flex:1 1 0;min-width:0}
.opt{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s,color .15s}
.opt:hover{border-color:var(--muted)}
button:focus-visible{outline:3px solid var(--sim-blue);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.sim{display:grid;place-items:center;padding:12px}
.sim i{display:block;width:32px;height:42px;clip-path:polygon(28% 0,100% 0,100% 100%,0 100%,0 22%);position:relative;border-radius:3px}
.sim i::after{content:"";position:absolute;left:50%;top:56%;width:15px;height:12px;transform:translate(-50%,-50%);border-radius:3px;background:linear-gradient(90deg,#e9c46a,#f6dc8f 50%,#d9b04f)}
.sim.red i{background:var(--sim-red)}
.sim.blue i{background:var(--sim-blue)}
.sim.opt[aria-pressed="true"]{background:var(--bg)}
.sim.red[aria-pressed="true"]{border-color:var(--sim-red)}
.sim.blue[aria-pressed="true"]{border-color:var(--sim-blue)}
.add{font:inherit;width:100%;padding:15px;font-weight:600;font-size:16px;border-radius:14px;border:0;background:var(--ink);color:#fff;cursor:pointer}
.add:hover{opacity:.9}

/* Big confirmation check */
.done{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none}
.done span{width:min(220px,55vw);aspect-ratio:1;border-radius:50%;background:var(--ok);display:grid;place-items:center;box-shadow:0 24px 70px rgba(31,157,85,.4);animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.done svg{width:58%;height:58%}
.done path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .15s ease forwards}
.done.out{animation:fadeOut .3s ease forwards}

@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes draw{to{stroke-dashoffset:0}}

@media (max-width:560px){
  .grid{gap:12px}
  .card{padding:8px;border-radius:16px}
  .row{gap:6px}
  .opt{font-size:13px;padding:11px 2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.done path{stroke-dashoffset:0}}
</style>
</head>
<body>

<main class="grid" id="grid"></main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="iPhone">
    <img class="photo" id="mPhoto" alt="iPhone">
    <button class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="opts">
      <div class="row" data-group="sim">
        <button class="opt sim red" id="sim-red" data-v="red" aria-label="Red SIM"><i></i></button>
        <button class="opt sim blue" id="sim-blue" data-v="blue" aria-label="Blue SIM"><i></i></button>
      </div>
      <div class="row" data-group="mem">
        <button class="opt" id="mem-128" data-v="128">128 GB</button>
        <button class="opt" id="mem-256" data-v="256">256 GB</button>
        <button class="opt" id="mem-512" data-v="512">512 GB</button>
        <button class="opt" id="mem-1tb" data-v="1tb">1 TB</button>
      </div>
      <div class="row" data-group="term">
        <button class="opt" id="term-6" data-v="6">6</button>
        <button class="opt" id="term-12" data-v="12">12</button>
        <button class="opt" id="term-24" data-v="24">24</button>
      </div>
      <button class="add" id="add">Add</button>
    </div>
  </div>
</div>

<div class="done" id="done" hidden>
  <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
</div>

const grid=document.getElementById("grid");
const overlay=document.getElementById("overlay");
const photo=document.getElementById("mPhoto");
const done=document.getElementById("done");
const state={};let current=null,lastCard=null,timer=null;

phones.forEach((p,i)=>{
  state[p]={sim:"red",mem:"128",term:"6"};
  const b=document.createElement("button");
  b.className="card";b.id="phone-"+(i+1);b.setAttribute("aria-label","iPhone");
  b.innerHTML='<img class="photo" src="'+IMG[p]+'" alt="">';
  b.onclick=()=>open(p,b);
  grid.appendChild(b);
});

function paint(){
  overlay.querySelectorAll("[data-group]").forEach(g=>{
    g.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",o.dataset.v===state[current][g.dataset.group]?"true":"false"));
  });
}
function open(p,card){
  current=p;lastCard=card;
  photo.src=IMG[p];
  paint();
  overlay.hidden=false;document.body.classList.add("lock");
  document.getElementById("add").focus({preventScroll:true});
}
function close(){
  overlay.hidden=true;document.body.classList.remove("lock");
  if(lastCard)lastCard.focus({preventScroll:true});
}
overlay.addEventListener("click",e=>{
  if(e.target===overlay)return close();
  const o=e.target.closest(".opt");
  if(o){state[current][o.closest("[data-group]").dataset.group]=o.dataset.v;paint();}
});
document.getElementById("close").onclick=close;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!overlay.hidden)close();});

document.getElementById("add").onclick=()=>{
  clearTimeout(timer);
  done.classList.remove("out");done.hidden=true;void done.offsetWidth;done.hidden=false;
  timer=setTimeout(()=>{
    done.classList.add("out");
    timer=setTimeout(()=>{done.hidden=true;done.classList.remove("out");close();},300);
  },1100);
};
</script>
